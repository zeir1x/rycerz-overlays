:root{--a:#ff7a1a;--hi:#ffb27a;--lo:#66310a;--glow:rgba(255,122,26,0.62);--soft:rgba(255,122,26,0.22);--v:#7b2ff2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:248px;overflow:hidden;background:transparent}
body{position:relative;font-family:RZI,Inter,'Segoe UI',Arial,sans-serif;color:#f3f2f8;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.chrome{font-family:RZD,'Arial Narrow',sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.01em;background:linear-gradient(180deg,#ffffff 0%,#eef0f7 34%,#a3a9bd 49%,#474c5e 52%,#d9dde9 68%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 16px var(--glow));padding:0 .06em;white-space:nowrap}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.24em;color:var(--hi);white-space:nowrap}
.plate{position:absolute;background:linear-gradient(100deg,rgba(9,11,22,.93),rgba(16,11,32,.88));border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.5);overflow:hidden;border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.plate::before{content:'';position:absolute;left:10px;top:18%;bottom:18%;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--hi),var(--a) 55%,var(--lo))}
.plate::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.plate .glow{position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 50%,var(--soft),transparent 60%);pointer-events:none}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.logo{display:block;filter:drop-shadow(0 0 12px rgba(123,47,242,.75))}
.ico{flex:none;color:#fff;filter:drop-shadow(0 0 8px var(--glow))}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2em;color:#fff;text-transform:uppercase}
.live i{width:12px;height:12px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 12px #ff3b5c;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.frame{position:absolute;border-radius:16px;box-shadow:0 0 34px var(--soft),inset 0 0 22px rgba(0,0,0,.28)}
.frame::before,.frame::after{content:'';position:absolute;border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.frame::before{inset:0;padding:2px;background:linear-gradient(135deg,var(--hi),rgba(255,255,255,.22) 30%,rgba(255,255,255,.08) 55%,var(--a) 100%)}
.frame::after{inset:-1px;padding:4px;background:conic-gradient(from var(--ang),transparent 0 74%,var(--a) 86%,#fff 91%,transparent 95%);animation:spin 7s linear infinite;filter:drop-shadow(0 0 8px var(--glow))}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.frame b{position:absolute;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff,var(--hi) 40%,var(--a));box-shadow:0 0 12px var(--glow)}
.frame b:nth-child(1){left:26px;top:-1px;width:min(120px,22%)}
.frame b:nth-child(4){right:26px;bottom:-1px;width:min(84px,16%);transform:scaleX(-1)}
.frame b:nth-child(2),.frame b:nth-child(3){width:7px;height:7px;border-radius:50%;background:var(--hi);top:14px}
