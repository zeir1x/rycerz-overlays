:root{--a:#7b2ff2;--hi:#b286f7;--lo:#311361;--glow:rgba(123,47,242,0.62);--soft:rgba(123,47,242,0.22);--v:#7b2ff2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060d}
body{position:relative;font-family:RZI,Inter,'Segoe UI',Arial,sans-serif;color:#f3f2f8;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.chrome{font-family:RZD,'Arial Narrow',sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.01em;background:linear-gradient(180deg,#ffffff 0%,#eef0f7 34%,#a3a9bd 49%,#474c5e 52%,#d9dde9 68%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 16px var(--glow));padding:0 .06em;white-space:nowrap}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.24em;color:var(--hi);white-space:nowrap}
.plate{position:absolute;background:linear-gradient(100deg,rgba(9,11,22,.93),rgba(16,11,32,.88));border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.5);overflow:hidden;border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.plate::before{content:'';position:absolute;left:10px;top:18%;bottom:18%;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--hi),var(--a) 55%,var(--lo))}
.plate::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.plate .glow{position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 50%,var(--soft),transparent 60%);pointer-events:none}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.logo{display:block;filter:drop-shadow(0 0 12px rgba(123,47,242,.75))}
.ico{flex:none;color:#fff;filter:drop-shadow(0 0 8px var(--glow))}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2em;color:#fff;text-transform:uppercase}
.live i{width:12px;height:12px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 12px #ff3b5c;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.frame{position:absolute;border-radius:16px;box-shadow:0 0 34px var(--soft),inset 0 0 22px rgba(0,0,0,.28)}
.frame::before,.frame::after{content:'';position:absolute;border-radius:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.frame::before{inset:0;padding:2px;background:linear-gradient(135deg,var(--hi),rgba(255,255,255,.22) 30%,rgba(255,255,255,.08) 55%,var(--a) 100%)}
.frame::after{inset:-1px;padding:4px;background:conic-gradient(from var(--ang),transparent 0 74%,var(--a) 86%,#fff 91%,transparent 95%);animation:spin 7s linear infinite;filter:drop-shadow(0 0 8px var(--glow))}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.frame b{position:absolute;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff,var(--hi) 40%,var(--a));box-shadow:0 0 12px var(--glow)}
.frame b:nth-child(1){left:26px;top:-1px;width:min(120px,22%)}
.frame b:nth-child(4){right:26px;bottom:-1px;width:min(84px,16%);transform:scaleX(-1)}
.frame b:nth-child(2),.frame b:nth-child(3){width:7px;height:7px;border-radius:50%;background:var(--hi);top:14px}
.frame b:nth-child(2){right:16px;animation:pulse 1.6s ease-in-out infinite}.frame b:nth-child(3){display:none}
.rot{position:absolute;inset:0}
.ri{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.ri.on{opacity:1;transform:none}
.in{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(var(--from,-40px))}to{opacity:1;transform:none}}
.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1100px 760px at 15% 110%,rgba(123,47,242,0.42),transparent 62%),radial-gradient(900px 700px at 95% -12%,rgba(123,47,242,.38),transparent 60%),linear-gradient(180deg,#07081a,#04040b)}
.bg .grid{position:absolute;left:-50%;right:-50%;top:42%;height:120%;background-image:linear-gradient(rgba(123,47,242,0.22) 1px,transparent 1px),linear-gradient(90deg,rgba(123,47,242,0.22) 1px,transparent 1px);background-size:72px 72px;transform:perspective(700px) rotateX(64deg);transform-origin:50% 0;animation:grid 3.5s linear infinite;-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%)}
@keyframes grid{to{background-position:0 72px}}
.bg .mark{position:absolute;opacity:.07;filter:blur(1px)}
.bg .streak{position:absolute;height:3px;width:52%;left:-60%;background:linear-gradient(90deg,transparent,var(--a),#fff,transparent);opacity:.8;transform:rotate(-22deg);animation:streak 7s linear infinite;filter:drop-shadow(0 0 10px var(--glow))}
@keyframes streak{0%{left:-60%}55%,100%{left:130%}}
.bg .dot{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;background:var(--hi);box-shadow:0 0 12px var(--glow);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120vh);opacity:0}}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65))}
.bg{background:radial-gradient(circle at var(--cx) var(--cy),#1a0f33 0%,#0b0818 45%,#05040b 100%)}
.bg .grid,.bg .streak{display:none}
.bg .rays{position:absolute;left:calc(var(--cx) - var(--R));top:calc(var(--cy) - var(--R));width:calc(var(--R)*2);height:calc(var(--R)*2);background:repeating-conic-gradient(from var(--rr,0deg),rgba(168,121,255,.13) 0deg 2.2deg,transparent 2.2deg 7deg);-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 22%,transparent 48%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 22%,transparent 48%);animation:rays 60s linear infinite}
@property --rr{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rays{to{--rr:360deg}}
.bg .burst{position:absolute;inset:0;background:radial-gradient(circle at var(--cx) var(--cy),rgba(198,170,255,.30) 0%,rgba(123,47,242,0.22) 14%,rgba(123,47,242,.10) 32%,transparent 58%);animation:burst 6s ease-in-out infinite}
@keyframes burst{50%{opacity:.75}}
.bg .smoke{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;background:radial-gradient(circle,rgba(123,47,242,.55),transparent 65%)}
.bg .s1{width:60%;height:60%;left:-12%;bottom:-18%;animation:drift 18s ease-in-out infinite}
.bg .s2{width:55%;height:55%;right:-14%;top:-16%;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(6%,-5%) scale(1.08)}}
.bg .br{position:absolute;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(10,6,22,.85) 20%,rgba(30,16,62,.9) 50%,rgba(10,6,22,.85) 80%,transparent);filter:blur(2px);box-shadow:0 -2px 0 rgba(168,121,255,.18);animation:brush 9s ease-in-out infinite}
@keyframes brush{50%{translate:2% -1%}}
.bg .sl{position:absolute;left:-40%;height:2px;background:linear-gradient(90deg,transparent,rgba(198,170,255,.55),transparent);transform:rotate(-24deg);animation:sl linear infinite;opacity:.7}
